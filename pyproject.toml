[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "funmirror"
version = "0.1.6"
description = "Mirror GitHub organization repos to Gitee, in parallel, skipping repos that are already up to date"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "funworker>=0.0.1",
    "farlog>=1.1.8",
    "requests>=2.32.5",
]
license-files = ["LICENSE"]

[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"
[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funmirror"
Releases = "https://github.com/farfarfun/funmirror/releases"

[project.scripts]
funmirror = "funmirror.script:funmirror"

[tool.hatch.build.targets.wheel]
packages = ["src/funmirror"]
